<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a08">
  <meta name="description" content="Agent Number One — intelligent systems, built to act.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Agent Number One">
  <meta property="og:description" content="Intelligent systems, built to act.">
  <meta property="og:url" content="https://agentnumberone.dev/">
  <link rel="canonical" href="https://agentnumberone.dev/">
  <title>Agent Number One — A1</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f5ed;
      --muted: #858d82;
      --line: rgba(229, 255, 211, 0.13);
      --signal: #b9ff66;
      --signal-bright: #dcffaf;
      --bg: #080a08;
      --mx: 50%;
      --my: 50%;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 35rem at var(--mx) var(--my), rgba(185, 255, 102, 0.075), transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: auto, 48px 48px, 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .page {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(22px, 3vw, 42px);
      isolation: isolate;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fade-in 700ms ease 900ms forwards;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 700;
    }

    .wordmark::before {
      content: "";
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 16px var(--signal);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .status { display: flex; align-items: center; gap: 8px; }
    .status::before { content: "["; color: var(--line); }
    .status::after { content: "]"; color: var(--line); }

    main {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .hero {
      width: min(92vw, 840px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .machine {
      position: relative;
      width: clamp(210px, 35vw, 410px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: clamp(24px, 4vh, 48px);
    }

    .orbit {
      position: absolute;
      inset: 4%;
      border: 1px solid var(--line);
      border-radius: 50%;
      opacity: 0;
      animation: orbit-enter 1.2s cubic-bezier(.22, 1, .36, 1) 180ms forwards, orbit-turn 32s linear 1.4s infinite;
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      top: 50%;
      left: -3px;
      width: 5px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 14px var(--signal);
    }

    .orbit::after { left: auto; right: -3px; background: var(--ink); box-shadow: none; }

    .orbit--inner {
      inset: 17%;
      border-style: dashed;
      opacity: 0;
      animation: orbit-enter 1.2s cubic-bezier(.22, 1, .36, 1) 300ms forwards, orbit-turn-reverse 24s linear 1.5s infinite;
    }

    .reticle {
      position: absolute;
      inset: 28%;
      border: 1px solid rgba(185, 255, 102, 0.18);
      transform: rotate(45deg) scale(0);
      animation: reticle-enter 900ms cubic-bezier(.16, 1, .3, 1) 460ms forwards;
    }

    .reticle::before, .reticle::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(185, 255, 102, 0.09);
    }

    .reticle::after { inset: 28%; }

    .mark {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      color: var(--ink);
      font-size: clamp(78px, 14vw, 162px);
      font-weight: 850;
      line-height: 0.8;
      letter-spacing: -0.1em;
      filter: drop-shadow(0 0 28px rgba(185, 255, 102, 0.08));
    }

    .mark span {
      display: block;
      clip-path: inset(100% 0 0 0);
      transform: translateY(14px);
      animation: mark-reveal 900ms cubic-bezier(.22, 1, .36, 1) 550ms forwards;
    }

    .mark span:last-child {
      color: var(--signal);
      animation-delay: 690ms;
    }

    .scan {
      position: absolute;
      z-index: 3;
      left: 24%;
      right: 24%;
      height: 1px;
      top: 31%;
      background: linear-gradient(90deg, transparent, var(--signal-bright), transparent);
      box-shadow: 0 0 12px var(--signal);
      opacity: 0;
      animation: scan 3.4s ease-in-out 1.45s infinite;
    }

    .coordinate {
      position: absolute;
      color: #687064;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 8px;
      letter-spacing: 0.16em;
      opacity: 0;
      animation: fade-in 500ms ease 1.1s forwards;
    }
    .coordinate--tl { top: 11%; left: 7%; }
    .coordinate--br { right: 7%; bottom: 11%; }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--signal);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      animation: content-in 700ms cubic-bezier(.22, 1, .36, 1) 1s forwards;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(36px, 6.4vw, 76px);
      font-weight: 650;
      line-height: 0.98;
      letter-spacing: -0.055em;
      opacity: 0;
      transform: translateY(14px);
      animation: content-in 800ms cubic-bezier(.22, 1, .36, 1) 1.12s forwards;
    }

    h1 em { color: var(--muted); font-style: normal; }

    .subline {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(13px, 1.5vw, 16px);
      line-height: 1.6;
      letter-spacing: 0.015em;
      opacity: 0;
      transform: translateY(10px);
      animation: content-in 700ms cubic-bezier(.22, 1, .36, 1) 1.28s forwards;
    }

    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      border-color: rgba(185, 255, 102, 0.3);
      border-style: solid;
      pointer-events: none;
    }
    .corner--tl { left: 12px; top: 12px; border-width: 1px 0 0 1px; }
    .corner--tr { right: 12px; top: 12px; border-width: 1px 1px 0 0; }
    .corner--bl { left: 12px; bottom: 12px; border-width: 0 0 1px 1px; }
    .corner--br { right: 12px; bottom: 12px; border-width: 0 1px 1px 0; }

    @keyframes fade-in { to { opacity: 1; } }
    @keyframes pulse { 50% { opacity: .45; box-shadow: 0 0 5px var(--signal); } }
    @keyframes content-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes mark-reveal { to { clip-path: inset(0 0 0 0); transform: translateY(0); } }
    @keyframes orbit-enter { from { opacity: 0; transform: scale(.78) rotate(-16deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes orbit-turn { to { transform: rotate(360deg); } }
    @keyframes orbit-turn-reverse { to { transform: rotate(-360deg); } }
    @keyframes reticle-enter { to { transform: rotate(45deg) scale(1); } }
    @keyframes scan {
      0%, 12% { top: 31%; opacity: 0; }
      20% { opacity: .9; }
      58% { top: 69%; opacity: .9; }
      68%, 100% { top: 69%; opacity: 0; }
    }

    @media (max-width: 600px) {
      .page { padding: 24px 22px; }
      .machine { width: min(76vw, 310px); margin-bottom: 24px; }
      .desktop-only { display: none; }
      footer { letter-spacing: .1em; }
      h1 { max-width: 11ch; }
      .subline { max-width: 32ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
      body::before { background-position: center; }
    }
  </style>
</head>
<body>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="page">
    <header>
      <div class="wordmark">Agent Number One</div>
      <div class="status">System online</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="machine" aria-label="A1 animated identity">
          <div class="orbit"></div>
          <div class="orbit orbit--inner"></div>
          <div class="reticle"></div>
          <div class="scan"></div>
          <span class="coordinate coordinate--tl">01 / 01</span>
          <span class="coordinate coordinate--br">A1.ACTIVE</span>
          <div class="mark" aria-hidden="true"><span>A</span><span>1</span></div>
        </div>

        <p class="eyebrow">Agent Number One</p>
        <h1 id="hero-title">Intelligent systems, <em>built to act.</em></h1>
        <p class="subline">The first agent is initializing. Something capable is coming.</p>
      </section>
    </main>

    <footer>
      <span>Agentnumberone.dev</span>
      <span class="desktop-only">Independent intelligence / 001</span>
      <span>Coming soon</span>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    let frame;

    window.addEventListener("pointermove", ({ clientX, clientY }) => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        root.style.setProperty("--mx", `${clientX}px`);
        root.style.setProperty("--my", `${clientY}px`);
      });
    }, { passive: true });
  </script>
</body>
</html>
