<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="working-rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop class="working-color-stop" offset="0" stop-color="#215eea"/>
      <stop class="working-color-stop" style="--color-phase: -.6s" offset=".33" stop-color="#833fe0"/>
      <stop class="working-color-stop" style="--color-phase: -1.2s" offset=".66" stop-color="#cc227d"/>
      <stop class="working-color-stop" style="--color-phase: -1.8s" offset="1" stop-color="#00856f"/>
    </linearGradient>
    <linearGradient id="panel" x1="65" y1="54" x2="400" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f2fb"/></linearGradient>
    <mask id="a1-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="480" style="mask-type: luminance">
      <rect width="480" height="480" fill="#fff"/>
      <text x="238" y="108" text-anchor="middle" fill="#000" font-family="'DM Sans', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-3.5">a1</text>
    </mask>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#474e7b" flood-opacity=".22"/></filter>
  </defs>
  <g mask="url(#a1-cutout)">

  <!-- A flat, simplified a1 session with real input and tool-block conventions. -->
  <g filter="url(#shadow)">
    <rect x="55" y="54" width="370" height="336" rx="4" fill="url(#panel)" fill-opacity=".9" stroke="#fff" stroke-opacity=".85"/>

    <rect class="art-surface" x="77" y="151" width="326" height="35" rx="4" fill="#dbe6ff" fill-opacity=".6"/>
    <text x="89" y="173" fill="#3c5688" font-family="monospace" font-size="14">❯ Add tests for expired tokens</text>
    <text x="391" y="173" text-anchor="end" fill="#788297" font-family="monospace" font-size="14">14:32</text>

    <rect class="art-surface" x="77" y="199" width="326" height="55" rx="4" fill="#d6f1e2" fill-opacity=".6"/>
    <text x="89" y="218" fill="#31654f" font-family="monospace" font-size="14"><tspan font-weight="700">bash</tspan> npm test</text>
    <text x="89" y="241" fill="#357c5d" font-family="monospace" font-size="14">✓ 3 tests passed</text>
    <g class="working-spinner" fill="none" stroke-width="1.5">
      <circle cx="86" cy="274" r="5" stroke="#c4cada"/>
      <path d="M86 269a5 5 0 0 1 5 5" stroke="#6b92d2" stroke-opacity=".8" stroke-linecap="round"/>
    </g>
    <text x="102" y="278" fill="#58627d" font-family="monospace" font-size="14" font-weight="700">Working...</text>
    <text class="working-rainbow-text" x="102" y="278" fill="url(#working-rainbow)" font-family="monospace" font-size="14" font-weight="700" opacity="0">Working...</text>

    <path d="M77 301h326M77 346h326" stroke="#a689cc" stroke-opacity=".8" stroke-width="1.5"/>
    <text class="art-suggestion" x="84" y="329" fill="#77839c" font-family="monospace" font-size="14">❯ Review the changes</text>
    <rect class="art-key" x="357" y="313" width="37" height="23" rx="4" fill="#e8ddfa" fill-opacity=".6" stroke="#c0a4e2"/>
    <rect class="art-cursor" x="257" y="317" width="6" height="14" fill="#8277ac" opacity="0"/>
    <text x="375.5" y="329" text-anchor="middle" fill="#72459f" font-family="monospace" font-size="14">Tab</text>
    <text x="401" y="370" text-anchor="end" fill="#8859ba" font-family="monospace" font-size="14">high</text>
  </g>
  </g>
</svg>
