<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <defs>
    <linearGradient id="pane-neutral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f2fb"/></linearGradient>
    <mask id="a1-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="480" style="mask-type: luminance">
      <rect width="480" height="480" fill="#fff"/>
      <text x="238" y="108" text-anchor="middle" fill="#000" font-family="'DM Sans', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-3.5">A1</text>
    </mask>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#284e83" flood-opacity=".2"/></filter>
  </defs>
  <g mask="url(#a1-cutout)">

  <!-- One A1 workspace branches into three simultaneous agent panes. -->
  <g stroke="#ecf6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="art-flow" d="M240 132V232M88 232v-50h304v50"/><circle cx="240" cy="182" r="4" fill="#edf7ff"/></g>
  <!-- Normalize the dashes so short and long routes both carry a ~12px pulse. -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path class="agent-pulse pulse-trunk" style="--pulse-length: 24" d="M240 132V182" pathLength="100" stroke="#e3d3ff" stroke-dasharray="24 100" stroke-dashoffset="24" opacity="0"/>
    <path class="agent-pulse pulse-branch" style="--pulse-length: 6" d="M240 182H88V232" pathLength="100" stroke="#bddaff" stroke-dasharray="6 100" stroke-dashoffset="6" opacity="0"/>
    <path class="agent-pulse pulse-branch" style="--pulse-length: 24" d="M240 182V232" pathLength="100" stroke="#d5baff" stroke-dasharray="24 100" stroke-dashoffset="24" opacity="0"/>
    <path class="agent-pulse pulse-branch" style="--pulse-length: 6" d="M240 182H392V232" pathLength="100" stroke="#a8e0cb" stroke-dasharray="6 100" stroke-dashoffset="6" opacity="0"/>
  </g>
  <g filter="url(#shadow)">
    <rect class="art-surface" x="166" y="54" width="148" height="78" rx="4" fill="#f3faff" fill-opacity=".9" stroke="#fff" stroke-opacity=".85"/>
  </g>

  <g transform="translate(24 232)" filter="url(#shadow)">
    <rect class="art-surface" width="128" height="163" rx="4" fill="url(#pane-neutral)" fill-opacity=".9" stroke="#fff" stroke-opacity=".8"/>
    <path d="M0 25h128" stroke="#54729c" stroke-opacity=".12"/>
    <g fill="#9cb2cf" fill-opacity=".7"><circle cx="13" cy="13" r="2.5"/><circle cx="23" cy="13" r="2.5"/><circle cx="33" cy="13" r="2.5"/></g>
    <rect x="15" y="40" width="31" height="29" rx="4" fill="#c3d8ff" fill-opacity=".6"/><path d="m24 49 5 5-5 5m9 0h5" stroke="#4675bb" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="93" fill="#454b58" font-family="Arial, sans-serif" font-size="18" font-weight="600">Plan</text>
    <g class="art-code" stroke="#93b8ff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"><path d="M17 110h69M17 121h43"/></g>
    <circle class="art-activity" cx="18" cy="144" r="3" fill="#5e8ee0" fill-opacity=".8"/><text x="28" y="148" fill="#626976" font-family="monospace" font-size="14">agent 01</text>
  </g>
  <g transform="translate(176 232)" filter="url(#shadow)">
    <rect class="art-surface" width="128" height="163" rx="4" fill="url(#pane-neutral)" fill-opacity=".9" stroke="#fff" stroke-opacity=".8"/>
    <path d="M0 25h128" stroke="#54729c" stroke-opacity=".12"/>
    <g fill="#b0a6ce" fill-opacity=".7"><circle cx="13" cy="13" r="2.5"/><circle cx="23" cy="13" r="2.5"/><circle cx="33" cy="13" r="2.5"/></g>
    <rect x="15" y="40" width="31" height="29" rx="4" fill="#dcc5ff" fill-opacity=".6"/><path d="m25 48-5 6 5 6m10-12 5 6-5 6" stroke="#8859ba" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="93" fill="#454b58" font-family="Arial, sans-serif" font-size="18" font-weight="600">Build</text>
    <g class="art-code" style="--art-delay: .35s" stroke="#b4a4ff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"><path d="M17 110h48M17 121h78"/></g>
    <circle class="art-activity" style="--art-delay: .35s" cx="18" cy="144" r="3" fill="#a475d4" fill-opacity=".8"/><text x="28" y="148" fill="#626976" font-family="monospace" font-size="14">agent 02</text>
  </g>
  <g transform="translate(328 232)" filter="url(#shadow)">
    <rect class="art-surface" width="128" height="163" rx="4" fill="url(#pane-neutral)" fill-opacity=".9" stroke="#fff" stroke-opacity=".8"/>
    <path d="M0 25h128" stroke="#54729c" stroke-opacity=".12"/>
    <g fill="#9abcb6" fill-opacity=".7"><circle cx="13" cy="13" r="2.5"/><circle cx="23" cy="13" r="2.5"/><circle cx="33" cy="13" r="2.5"/></g>
    <rect x="15" y="40" width="31" height="29" rx="4" fill="#bce9d2" fill-opacity=".6"/><path d="m23 54 5 5 10-11" stroke="#32886a" stroke-opacity=".8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="93" fill="#454b58" font-family="Arial, sans-serif" font-size="18" font-weight="600">Review</text>
    <g class="art-code" style="--art-delay: .7s" stroke="#79c5a7" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"><path d="M17 110h73M17 121h55"/></g>
    <circle class="art-activity" style="--art-delay: .7s" cx="18" cy="144" r="3" fill="#43a57f" fill-opacity=".8"/><text x="28" y="148" fill="#626976" font-family="monospace" font-size="14">agent 03</text>
  </g>
  </g>
</svg>
